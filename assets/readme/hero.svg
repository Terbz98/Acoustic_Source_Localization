<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Acoustic Source Localization</title>
  <desc id="desc">Two microphone arrays one metre apart each measure the direction of a sound; their bearings cross at the source 1.5 metres away, 36.9 degrees apart. That crossing gives the distance, and a 360-degree camera turns its view to it live.</desc>

  <rect width="1200" height="400" rx="20" fill="#0E1116"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#8B949E">SPHERICAL MICROPHONE ARRAYS · 360° VIDEO</text>
    <text x="54" y="164" font-size="60" font-weight="700" fill="#F2EFE9">Acoustic Source</text>
    <text x="54" y="230" font-size="60" font-weight="700" fill="#F2EFE9">Localization</text>
    <text x="56" y="284" font-size="24" fill="#C9CED6">Locates a sound in 3D with two microphone</text>
    <text x="56" y="318" font-size="24" fill="#C9CED6">arrays, and turns a 360° camera to it, live.</text>
    <text x="56" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B949E">MATLAB · Python · Zylia ZM-1 · Zoom H3-VR · Insta360 X4</text>
  </g>

  <g id="top-view" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <!-- to scale: 160 units = 1 m; mid-point of the mics at (920, 290) -->
    <line x1="920" y1="300" x2="920" y2="70" stroke="#2A313B" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text x="920" y="230" text-anchor="middle" fill="#5C6570" transform="rotate(-90 920 230)" dy="-10">front</text>

    <!-- each array's direction map, pointing at the sound -->
    <ellipse cx="0" cy="0" rx="34" ry="13" transform="translate(840 290) rotate(-71.57) translate(36 0)" fill="#3CD2FF" fill-opacity="0.16" stroke="#3CD2FF" stroke-opacity="0.55" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="34" ry="13" transform="translate(1000 290) rotate(-108.43) translate(36 0)" fill="#FFAA00" fill-opacity="0.16" stroke="#FFAA00" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- the two bearings -->
    <line x1="840" y1="290" x2="920" y2="50" stroke="#3CD2FF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1000" y1="290" x2="920" y2="50" stroke="#FFAA00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 905.45 93.64 A 46 46 0 0 0 934.55 93.64" fill="none" stroke="#F2EFE9" stroke-width="1.5"/>
    <text x="950" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#F2EFE9">36.9°</text>

    <!-- the sound -->
    <circle cx="920" cy="50" r="11" fill="#0E1116" stroke="#F2EFE9" stroke-width="2.5"/>
    <circle cx="920" cy="50" r="4" fill="#F2EFE9"/>
    <text x="942" y="56" fill="#F2EFE9">sound · 1.5 m</text>

    <!-- the rig -->
    <line x1="840" y1="312" x2="1000" y2="312" stroke="#5C6570" stroke-width="1.5"/>
    <line x1="840" y1="305" x2="840" y2="319" stroke="#5C6570" stroke-width="1.5"/>
    <line x1="1000" y1="305" x2="1000" y2="319" stroke="#5C6570" stroke-width="1.5"/>
    <circle cx="840" cy="290" r="9" fill="#3CD2FF"/>
    <circle cx="1000" cy="290" r="9" fill="#FFAA00"/>
    <text x="840" y="342" text-anchor="middle" fill="#3CD2FF">Zoom</text>
    <text x="920" y="342" text-anchor="middle" fill="#8B949E">1 m</text>
    <text x="1000" y="342" text-anchor="middle" fill="#FFAA00">Zylia</text>
    <text x="920" y="374" text-anchor="middle" fill="#8B949E">distance = where the bearings cross</text>
  </g>
</svg>
